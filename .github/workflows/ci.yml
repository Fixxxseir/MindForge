name: Django CI

on: [ push, pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # ПОЛУЧАЕМ КОД ИЗ РЕПОЗИТОРИЯ
      - name: Check out code
        uses: actions/checkout@v3

      # УСТАНАВЛИВЕМ python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # УСТАНОВКА ЛИНТЕРА
      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including flake8)
        run: poetry install --no-root

      - name: Run Flake8 via Poetry
        run: poetry run flake8 .

  test:
    # СРЕДА ГДЕ БУДЕТ ВЫПОЛНЯТЬСЯ ЗАДАЧА
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      # КЛОНИРОВАНИЕ РЕПОЗИТОРИЯ С ИСХОДНЫМ КОДОМ
      - name: Check out code
        uses: actions/checkout@v3

      # УСТАНОВКА Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # КЕШИРОВАНИЕ ЗАВИСИМОСТЕЙ(что бы ускорить процесс установки зависимостей)
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # УСТАНОВКА Poetry и УСТАНОВКА ЗАВИСИМОСТЕЙ
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      # МИГРАЦИИ
      - name: Run migrate
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          poetry run python manage.py migrate

      # ЗАПУСК ТЕСТОВ
      - name: Run tests
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # КЛОНИРУЕМ КОД ИЗ РЕПОЗИТОРИЯ
      - name: Check out code
        uses: actions/checkout@v3

      # АВТОРИЗУЕМСЯ(аутентификация) В Docker Hub используя учетные данные из секретов
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build and push web image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mindforge-web:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mindforge-web:${{ github.sha }}

      - name: Build and push nginx image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mindforge-nginx:${{ github.sha }} -f nginx/Dockerfile ./nginx
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mindforge-nginx:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ЧЕРЕЗ SSH
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOTENV }}
          EOF

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml .env ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/MindForge/
          scp -r -o StrictHostKeyChecking=no ./nginx ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/MindForge/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd MindForge && \
            sudo docker-compose down --remove-orphans && \
            sudo docker-compose pull && \
            sudo docker-compose up -d --build
          "
          
          
          
          
          


